# nginx server blocks for reinersbot.space — the live, TLS-enabled form.
#
# Layout under root /var/www/reinersbot:
#   /               static landing site (landing/, deployed by deploy/deploy-landing.sh)
#   /dashboard/     admin dashboard SPA (dashboard/dist, built with VITE_BASE_PATH=/dashboard/)
#   /api/           proxied to the bot's dashboard server on :4000 (src/dashboard/server.ts
#                   builds links from the request's own origin, not a path-prefixed URL)
#
# Requires the shared header snippet next to this file:
#   cp deploy/nginx-reinersbot-security.conf /etc/nginx/snippets/reinersbot-security.conf
#
# Install / update on the VPS:
#   cp deploy/nginx-reinersbot.conf /etc/nginx/sites-available/reinersbot
#   ln -sf /etc/nginx/sites-available/reinersbot /etc/nginx/sites-enabled/reinersbot
#   nginx -t && systemctl reload nginx
#
# The ssl_* lines and the :80 block were generated by
#   certbot --nginx -d reinersbot.space -d www.reinersbot.space --redirect
# (certificate auto-renews via certbot.timer). On a fresh server, install the
# certificate first, then drop this file over the certbot-edited one.
#
# NOTE: any location with its own add_header drops the server-level ones, so
# every such location re-includes the security snippet.

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name reinersbot.space www.reinersbot.space;

	ssl_certificate /etc/letsencrypt/live/reinersbot.space/fullchain.pem; # managed by Certbot
	ssl_certificate_key /etc/letsencrypt/live/reinersbot.space/privkey.pem; # managed by Certbot
	include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

	server_tokens off;

	# One canonical host.
	if ($host = www.reinersbot.space) {
		return 301 https://reinersbot.space$request_uri;
	}

	root /var/www/reinersbot;
	include snippets/reinersbot-security.conf;

	gzip on;
	gzip_vary on;
	gzip_min_length 512;
	gzip_types text/css application/javascript application/json application/manifest+json
	           application/xml text/xml text/plain image/svg+xml image/x-icon;

	# ── API -> the bot's dashboard server. Bot's own JSON errors pass through
	#    (no proxy_intercept_errors), so error_page below never applies here.
	location /api/ {
		proxy_pass http://127.0.0.1:4000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Docs moved out of the dashboard SPA to the static site at /docs/.
	location = /dashboard/docs { return 301 /docs/; }
	location = /dashboard/docs/ { return 301 /docs/; }

	# ── Dashboard SPA. Unknown paths fall back to its index.html so a refresh on
	#    /dashboard/docs (or any client route) still loads.
	location /dashboard/ {
		try_files $uri $uri/ /dashboard/index.html;
		add_header Cache-Control "no-cache" always;
		include snippets/reinersbot-security.conf;
	}
	# Vite emits content-hashed filenames here, so they can be cached forever.
	location ^~ /dashboard/assets/ {
		try_files $uri =404;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		include snippets/reinersbot-security.conf;
	}

	# ── Landing site. No SPA fallback: unknown paths get the real 404 page.
	error_page 404 /404.html;

	location / {
		try_files $uri $uri/ =404;
		add_header Cache-Control "no-cache" always;
		add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://ddragon.leagueoflegends.com; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
		include snippets/reinersbot-security.conf;
	}

	location = /site.webmanifest {
		default_type application/manifest+json;
		add_header Cache-Control "public, max-age=86400" always;
		include snippets/reinersbot-security.conf;
	}

	# deploy-landing.sh stamps ?v=<content hash> on every CSS/JS reference.
	location ^~ /css/ {
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		include snippets/reinersbot-security.conf;
	}
	location ^~ /js/ {
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		include snippets/reinersbot-security.conf;
	}
	location ^~ /assets/ {
		add_header Cache-Control "public, max-age=2592000" always;
		include snippets/reinersbot-security.conf;
	}
}

server {
	if ($host = www.reinersbot.space) {
		return 301 https://$host$request_uri;
	} # managed by Certbot

	if ($host = reinersbot.space) {
		return 301 https://$host$request_uri;
	} # managed by Certbot

	listen 80;
	listen [::]:80;
	server_name reinersbot.space www.reinersbot.space;
	server_tokens off;
	return 404; # managed by Certbot
}
