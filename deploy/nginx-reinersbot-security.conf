# Shared response headers for reinersbot.space.
# Install: cp deploy/nginx-reinersbot-security.conf /etc/nginx/snippets/reinersbot-security.conf
# Included at server level AND in every location that sets its own add_header
# (nginx drops inherited add_header directives as soon as a location adds one).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
